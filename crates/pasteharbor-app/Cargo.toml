[package]
name = "pasteharbor-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
pasteharbor-core = { path = "../pasteharbor-core" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
serde_json = "1.0"
zbus = { version = "5.0", default-features = false, features = ["blocking-api", "async-io"] }
